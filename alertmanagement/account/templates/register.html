
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALERT - Citizen Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

    <header class="relative bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 text-gray-800">
                <!-- Logo -->
                <img src="{% static 'images/logo.png' %}" alt="ALERT Logo" class="h-10 w-auto object-contain" />
            </a>
        </nav>
    </header>

    <main class="flex justify-center items-center py-12" style="min-height: calc(100vh - 72px);">
        <div class="bg-gray-50 border border-gray-200 p-8 rounded-2xl shadow-xl w-full max-w-lg relative">
            <a href="{% url 'index' %}" class="absolute top-6 left-6 text-gray-600 hover:text-red-600 transition-colors" aria-label="Back to Home">
                <!-- BackArrowIcon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>

            <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Create Citizen Account</h2>
            <p class="text-gray-600 mb-8 text-center">All new users register as a Citizen by default.</p>

            <form id="register-form" action="{% url 'citizen_profile_completion' %}">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <input type="text" name="firstName" placeholder="First Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <input type="text" name="middleName" placeholder="Middle Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <input type="text" name="lastName" placeholder="Last Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>
                <div class="mb-4">
                    <input type="email" name="email" placeholder="Email Address" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>
                <div class="mb-4">
                    <input type="password" id="password" name="password" placeholder="Password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>
                <div class="mb-6">
                   <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-bold py-3 px-4 rounded-lg hover:from-red-700 hover:to-red-800 shadow-lg transition-transform transform hover:scale-105">
                    Register
                </button>
            </form>
        </div>
    </main>

    <script>
        const registerForm = document.getElementById('register-form');

        registerForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const formData = new FormData(registerForm);
            const data = Object.fromEntries(formData.entries());
            console.log("Registering citizen:", data);

            alert("Registration successful! You can now sign in.");
            // Redirect to home/login page after a short delay
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });
    </script>
</body>
</html>
