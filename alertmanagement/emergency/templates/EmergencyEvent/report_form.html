<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Form</title>
    <link rel="stylesheet" href="report.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo">
                <img src="logo.jpg" alt="ALERT Logo">
                <span class="logo-text"></span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Chat</a>
                <a href="#">Call Logs</a>
            </nav>
            <div class="user-info">
                <span>Julian Andales</span>
                <img src="profile_image.jpg" alt="User Profile" class="profile-pic">
            </div>
        </header>

        <main class="content-area">
            <div class="report-form-card">
                <div class="form-header">
                    <h2>Report Form</h2>
                </div>

                <div class="form-content">
                    <div class="left-form-panel">
                        <div class="form-group">
                            <label for="name">NAME</label>
                            <input type="text" id="name" placeholder="(automatically filled up by the system)">
                        </div>

                        <div class="form-group">
                            <label for="address">ADDRESS</label>
                            <input type="text" id="address" placeholder="(automatically filled up by the system)">
                        </div>

                        <div class="form-group">
                        <label>TYPE OF EMERGENCY</label>
                        <div class="radio-group">
                        <label><input type="radio" name="emergencyType" value="fire"> FIRE</label>
                        <label><input type="radio" name="emergencyType" value="crime"> CRIME</label>
                        <label><input type="radio" name="emergencyType" value="medical"> MEDICAL</label>
                        <label><input type="radio" name="emergencyType" value="accident"> ACCIDENT</label>
                        </div>
                        <div class="others-input">
                        <label><input type="radio" name="emergencyType" value="others"> OTHERS; SPECIFY</label> <input type="text" id="others">
                        </div>
                        </div>

                        <div class="form-group">
                            <label>ARE YOU REPORTING FOR OTHERS</label>
                            <div class="radio-group">
                                <label><input type="radio" name="reportingForOthers" value="yes"> YES</label>
                                <label><input type="radio" name="reportingForOthers" value="no" checked> NO</label>
                            </div>
                            <p class="sub-label">IF YOU CAN NAME THE PATIENT, PLEASE INDICATE(Optional)</p>
                            <div class="name-inputs">
                                <input type="text" placeholder="First Name">
                                <input type="text" placeholder="Middle Name">
                                <input type="text" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">DESCRIBE THE SITUATION</label>
                            <textarea id="description"></textarea>
                        </div>
                    </div>

                    <div class="right-map-panel">
                        <div class="map-placeholder">
                            <img src="map_image.png" alt="Map Placeholder" class="map-image-report">
                            <div class="map-label">map</div>
                        </div>
                        <button class="adjust-pin-btn">ADJUST PIN</button>
                    </div>
                </div>
                <div class="submit-button-container">
                    <button class="submit-report-btn">SUBMIT REPORT</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
