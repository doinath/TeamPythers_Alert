{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALERT - Citizen Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-white">

    <header class="relative bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 text-gray-800">
                <!-- Ensure logo path is correct -->
                <img src="{% static 'images/logo.png' %}" alt="ALERT Logo" class="h-10 w-auto object-contain" />
            </a>
        </nav>
    </header>

    <main class="flex justify-center items-center py-12" style="min-height: calc(100vh - 72px);">
        <div class="bg-gray-50 border border-gray-200 p-8 rounded-2xl shadow-xl w-full max-w-lg relative">
            <a href="{% url 'account:index' %}" class="absolute top-6 left-6 text-gray-600 hover:text-red-600 transition-colors" aria-label="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </a>

            <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Create Citizen Account</h2>
            <p class="text-gray-600 mb-8 text-center">All new users register as a Citizen by default.</p>

            <!-- Client Side Error Container -->
            <div id="error-container" class="hidden mb-6 transition-opacity duration-500 ease-out"></div>

            <!-- Server Side Messages (Django) -->
            {% if messages %}
            <div id="server-messages" class="mb-6 transition-opacity duration-500 ease-out">
                {% for message in messages %}
                <div class="p-4 rounded-lg text-sm font-medium animate-fade-in flex items-center mb-2 shadow-sm
                    {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% else %}bg-green-100 text-green-700 border border-green-200{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        {% if message.tags == 'error' %}
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        {% else %}
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        {% endif %}
                    </svg>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form id="register-form" method="POST" action="{% url 'account:register' %}" novalidate>
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <input type="text" name="first_name" value="{{ first_name|default:'' }}" placeholder="First Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <input type="text" name="middle_name" value="{{ middle_name|default:'' }}" placeholder="Middle Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <input type="text" name="last_name" value="{{ last_name|default:'' }}" placeholder="Last Name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>

                <div class="mb-4">
                    <input type="email" name="email" value="{{ email|default:'' }}" placeholder="Email Address" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>

                <div class="mb-4 relative">
                    <input type="tel" id="phone_number" name="phone_number" value="{{ phone_number|default:'' }}" placeholder="Phone Number (e.g., 09xxxxxxxxx)" maxlength="11"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>

                <div class="mb-4">
                    <input type="password" id="password" name="password" placeholder="Password (Min. 8 chars)" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>

                <div class="mb-6">
                   <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>

                <button type="submit" name="action" value="register" class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-bold py-3 px-4 rounded-lg hover:from-red-700 hover:to-red-800 shadow-lg transition-transform transform hover:scale-105">
                    Register
                </button>
            </form>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('register-form');
        const errorContainer = document.getElementById('error-container');
        const serverMessages = document.getElementById('server-messages');
        let errorTimeout;

        // --- 1. Auto-hide Server Messages after 5 seconds ---
        if (serverMessages) {
            setTimeout(() => {
                serverMessages.style.opacity = '0';
                setTimeout(() => serverMessages.remove(), 500);
            }, 5000); // Increased to 5 seconds for better readability
        }

        // --- 2. Helper function to show errors ---
        function showError(message) {
            clearTimeout(errorTimeout); // Stop any pending fade-outs

            errorContainer.style.opacity = '1';
            errorContainer.classList.remove('hidden');

            errorContainer.innerHTML = `
                <div class="p-4 bg-red-100 border border-red-200 text-red-700 rounded-lg text-sm font-medium flex items-center animate-fade-in shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    ${message}
                </div>
            `;

            errorContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Hide after 4 seconds
            errorTimeout = setTimeout(() => {
                errorContainer.style.opacity = '0';
                setTimeout(() => {
                    errorContainer.classList.add('hidden');
                    errorContainer.innerHTML = '';
                }, 500);
            }, 4000);
        }

        // --- 3. Form Submission Validation ---
        registerForm.addEventListener('submit', function(event) {
            // Clear previous errors
            errorContainer.classList.add('hidden');
            errorContainer.innerHTML = '';

            // Get values
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const phoneInput = document.getElementById('phone_number').value;
            const emailInput = document.querySelector('input[name="email"]').value;
            const first_name = document.querySelector('input[name="first_name"]').value;
            const last_name = document.querySelector('input[name="last_name"]').value;

            // -- Basic Empty Check --
            if (!first_name.trim() || !last_name.trim() || !emailInput.trim()) {
                event.preventDefault();
                showError("Please fill out all required fields.");
                return;
            }

            // -- Phone Number Validation --
            const phoneRegex = /^09\d{9}$/;
            if (!phoneRegex.test(phoneInput)) {
                event.preventDefault();
                showError("Phone number must start with '09' and contain exactly 11 digits.");
                return;
            }

            // -- Password Length Validation --
            if (password.length < 8) {
                event.preventDefault();
                showError("Password must be at least 8 characters long.");
                return;
            }

            // -- Password Match Validation (The Fix) --
            if (password !== confirm_password) {
                event.preventDefault();
                // Clear the confirm password field to force re-entry
                document.getElementById('confirm_password').value = '';
                showError("Passwords do not match. Please try again.");
                return;
            }
        });
    });
    </script>
</body>
</html>
