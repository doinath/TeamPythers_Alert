{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALERT - Complete Your Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-white">

    <header class="relative bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 text-gray-800">
                <!-- Logo -->
                <img src="{% static 'images/logo.png' %}" alt="ALERT Logo" class="h-10 w-auto object-contain" />
            </a>
        </nav>
    </header>
    
    <main class="flex justify-center items-start py-12">
        <div class="bg-gray-50 border border-gray-200 p-8 rounded-2xl shadow-xl w-full max-w-3xl">
            
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Complete Your <span class="text-red-600">Citizen</span> Profile</h2>
            <p class="text-gray-600 mb-8 text-center">This information is vital for emergency responders to assist you effectively.</p>
            
            <form id="profile-completion-form">
                <!-- Personal Information -->
                <section>
                    <h3 class="text-xl font-semibold text-gray-700 mb-4">Personal Information</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="dob" class="block text-sm font-medium text-gray-600 mb-1">Date of Birth</label>
                            <input type="date" id="dob" name="dob" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-600 mb-1">Gender</label>
                            <select id="gender" name="gender" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow bg-white">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-600 mb-1">Address</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" name="street" placeholder="Street" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                            <input type="text" name="barangay" placeholder="Barangay" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                            <input type="text" name="city" placeholder="City" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                            <input type="text" name="province" placeholder="Province" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                            <input type="text" name="zipCode" placeholder="Zip Code" required class="md:col-span-2 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                        </div>
                    </div>
                </section>

                <!-- Emergency Contact -->
                <section class="form-section">
                    <h3 class="text-xl font-semibold text-gray-700 mb-4">Emergency Contacts</h3>
                    <div id="emergency-contacts-container" class="space-y-4">
                        <!-- Dynamic contact entries will be injected here -->
                    </div>
                    <button type="button" id="add-contact-btn" class="mt-4 text-red-600 hover:text-red-800 font-semibold text-sm flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>
                        Add Another Contact
                    </button>
                </section>

                <!-- Medical Information -->
                <section class="form-section">
                    <h3 class="text-xl font-semibold text-gray-700 mb-4">Medical Information (Optional)</h3>
                    <div id="medical-info-container" class="space-y-4">
                        <!-- Dynamic medical entries will be injected here -->
                    </div>
                    <button type="button" id="add-medical-btn" class="mt-4 text-red-600 hover:text-red-800 font-semibold text-sm flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>
                        Add Medical Information
                    </button>
                </section>

                <!-- Government IDs -->
                <section class="form-section">
                    <h3 class="text-xl font-semibold text-gray-700 mb-4">Government IDs for Verification</h3>
                     <div id="government-ids-container" class="space-y-4">
                        <!-- Dynamic ID entries will be injected here -->
                    </div>
                    <button type="button" id="add-id-btn" class="mt-4 text-red-600 hover:text-red-800 font-semibold text-sm flex items-center">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>
                        Add Government ID
                    </button>
                </section>

                <div class="mt-8">
                    <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-bold py-3 px-4 rounded-lg hover:from-red-700 hover:to-red-800 shadow-lg transition-transform transform hover:scale-105">
                        Save Profile
                    </button>
                </div>
            </form>
        </div>
    </main>
    
    <script>
    function handleIdTypeChange(selectElement) {
        // Find the parent container of the entire ID entry
        const parentIdEntry = selectElement.closest('.id-entry');
        const otherIdWrapper = parentIdEntry.querySelector('.other-id-type-wrapper');
        const otherIdInput = otherIdWrapper.querySelector('input');

        if (selectElement.value === 'other') {
            otherIdWrapper.classList.remove('hidden');
            otherIdInput.required = true;
        } else {
            otherIdWrapper.classList.add('hidden');
            otherIdInput.required = false;
            otherIdInput.value = ''; // Clear the value if another option is selected
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('profile-completion-form');

        // Containers
        const contactsContainer = document.getElementById('emergency-contacts-container');
        const medicalContainer = document.getElementById('medical-info-container');
        const idsContainer = document.getElementById('government-ids-container');

        // "Add" Buttons
        const addContactBtn = document.getElementById('add-contact-btn');
        const addMedicalBtn = document.getElementById('add-medical-btn');
        const addIdBtn = document.getElementById('add-id-btn');

        let contactCounter = 0;
        let medicalCounter = 0;
        let idCounter = 0;

        // --- TEMPLATE FUNCTIONS ---
        const createContactEntry = () => {
            contactCounter++;
            const div = document.createElement('div');
            div.className = 'flex items-center space-x-4 p-4 border rounded-lg bg-white';
            div.innerHTML = `
                <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="contact_role_${contactCounter}" placeholder="Role/Relationship (e.g., Mother)" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <input type="tel" name="contact_phone_${contactCounter}" placeholder="Phone Number" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                </div>
                <button type="button" class="remove-btn flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            `;
            div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
            return div;
        };

        const createMedicalEntry = () => {
            medicalCounter++;
            const div = document.createElement('div');
            div.className = 'flex items-start space-x-4 p-4 border rounded-lg bg-white';
            div.innerHTML = `
                <div class="flex-grow space-y-4">
                    <input type="text" name="condition_name_${medicalCounter}" placeholder="Condition Name (e.g., Asthma)" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    <textarea name="condition_notes_${medicalCounter}" placeholder="Notes (e.g., medicine, severity, symptoms)" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow"></textarea>
                </div>
                <button type="button" class="remove-btn flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 transition-colors mt-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            `;
            div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
            return div;
        };

        const createIdEntry = () => {
            idCounter++;
            const div = document.createElement('div');
            div.className = 'id-entry flex items-start space-x-4 p-4 border rounded-lg bg-white';
            div.innerHTML = `
                <div class="flex-grow space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select name="id_type_${idCounter}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow bg-white" onchange="handleIdTypeChange(this)">
                            <option value="">Select ID Type</option>
                            <option value="national_id">National ID</option>
                            <option value="passport">Passport</option>
                            <option value="drivers_license">Driver's License</option>
                            <option value="other">Other</option>
                        </select>
                        <input type="text" name="id_number_${idCounter}" placeholder="ID Number" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    </div>
                    <div class="other-id-type-wrapper hidden">
                        <input type="text" name="id_type_other_${idCounter}" placeholder="Please specify ID type" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow" />
                    </div>
                    <div>
                         <label for="id_file_${idCounter}" class="block text-sm font-medium text-gray-600 mb-1">Upload ID Image</label>
                        <input type="file" id="id_file_${idCounter}" name="id_file_${idCounter}" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100"/>
                    </div>
                </div>
                <button type="button" class="remove-btn flex-shrink-0 flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 transition-colors mt-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            `;
            div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
            return div;
        };

        // --- EVENT LISTENERS ---
        addContactBtn.addEventListener('click', () => {
            contactsContainer.appendChild(createContactEntry());
        });

        addMedicalBtn.addEventListener('click', () => {
            medicalContainer.appendChild(createMedicalEntry());
        });

        addIdBtn.addEventListener('click', () => {
            idsContainer.appendChild(createIdEntry());
        });

        // Add one of each by default for user guidance
        contactsContainer.appendChild(createContactEntry());
        idsContainer.appendChild(createIdEntry());

        // --- FORM SUBMISSION ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Here you would process and send the data to your backend
            console.log("Profile data submitted:", data);

            alert("Profile saved successfully! Welcome to ALERT.");
            window.location.href = 'index.html'; // Redirect to home page after completion
        });
    });
    </script>
</body>
</html>
