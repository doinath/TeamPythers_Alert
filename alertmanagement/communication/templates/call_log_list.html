{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo and Nav -->
                <div class="flex items-center space-x-12 -ml-4">
                    <div class="flex items-center space-x-2">
                        <img src="{% static 'images/com_logo.png' %}" alt="ALERT Logo" class="h-10 w-auto object-contain" />
                    </div>
                    <nav class="hidden md:flex items-center space-x-12">
                        <a href="#dashboard" class="text-gray-500 hover:text-red-600 transition-colors">Dashboard</a>
                        <a href="{% url 'communication:messages' %}" class="text-gray-500 hover:text-red-600 transition-colors"> Chat</a>
                        <a href="{% url 'communication:call_logs' %}" class="text-red-600 border-b-2 border-red-600 font-semibold px-2 py-1">Call Logs</a>
                    </nav>
                </div>

                <!-- User Profile -->
                <div class="flex items-center space-x-10">
                    <div class="hidden md:flex items-center space-x-4">
                        <span class="text-gray-800 font-medium text-sm mr-3">Bessie Cooper</span>
                        <img class="h-8 w-8 rounded-full object-cover transition-transform duration-200 group-hover:scale-110 group-hover:shadow-lg"
                             src="https://i.pravatar.cc/40?u=bessie"
                             alt="User Avatar" />
                    </div>

                    <!-- Mobile Menu Button -->
                    <div class="md:hidden flex items-center">
                        <button id="mobile-menu-button" class="text-gray-600 hover:text-gray-800 focus:outline-none">
                            <svg id="menu-open-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                            <svg id="menu-close-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <nav class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="#dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900">Dashboard</a>
                <a href="{% url 'communication:messages' %}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900">Chat</a>
                <a href="{% url 'communication:call_logs' %}" class="block px-3 py-2 rounded-md text-base font-medium bg-red-50 text-red-700">Call logs</a>
            </nav>
            <div class="pt-4 pb-3 border-t border-gray-200">
                <div class="flex items-center px-5">
                    <img class="h-10 w-10 rounded-full object-cover" src="https://i.pravatar.cc/100?u=bessie" alt="User Avatar" />
                    <div class="ml-3">
                        <div class="text-base font-medium text-gray-800">Bessie Cooper</div>
                        <div class="text-sm font-medium text-gray-500">bessie.cooper@example.com</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 space-y-4 sm:space-y-0">
                <!-- Categories (All and Missed) -->
                <div class="flex space-x-2">
                    <a href="?call_type=all" id="filter-all" class="px-4 py-2 rounded-md text-sm font-medium bg-red-600 text-white">All</a>
                    <a href="?call_type=missed" id="filter-missed" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200">Missed</a>
                </div>

                <!-- Search Area -->
                <div class="relative w-full sm:w-auto">
                    <input type="text" id="search-input" placeholder="Search" class="pl-10 pr-4 py-2 border rounded-lg w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-red-500" />
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <!-- Call Log Table -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact Name</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start Call</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">End Call</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Call Type</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Duration</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="call-log-table-body">
                        {# Mock data will be injected here by JavaScript #}
                    </tbody>
                </table>
                <div id="no-calls-message" class="hidden px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">No call logs found.</div>
            </div>
        </div>
    </main>

    <script>
        // Mock data structure, mimicking your Django model's properties
        // Dates are strings to simplify client-side handling
        const mockCallLogsData = [
            {
                call_id: 1,
                start_time: "Mon 9 Aug, 10:49 AM",
                end_time: "Mon 9 Aug, 10:51 AM",
                duration: 120, // seconds
                call_type: "incoming",
                get_call_type_display: "Incoming",
                user_id: { id: 101, username: "medic_team", get_full_name: "Medic Team" },
                emergency_event: { is_authority: true, agency_name: "Fire Department" }
            },
            {
                call_id: 2,
                start_time: "Saturday 9 Aug, 10:49 AM",
                end_time: "Saturday 9 Aug, 11:04 AM",
                duration: 900, // 15 minutes
                call_type: "outgoing",
                get_call_type_display: "Outgoing",
                user_id: { id: 102, username: "responder2", get_full_name: "Responder 2" },
                emergency_event: { is_authority: true, agency_name: "Flood Department" }
            },
            {
                call_id: 3,
                start_time: "Mon 9 Aug, 10:49 AM",
                end_time: null,
                duration: 0,
                call_type: "missed",
                get_call_type_display: "Missed",
                user_id: { id: 103, username: "responder3", get_full_name: "Responder 3" },
                emergency_event: { is_authority: true, agency_name: "Fire Department" }
            },
            {
                call_id: 4,
                start_time: "Saturday 9 Aug, 10:49 AM",
                end_time: "Saturday 9 Aug, 10:51 AM",
                duration: 120, // 2 minutes
                call_type: "incoming",
                get_call_type_display: "Incoming",
                user_id: { id: 104, username: "johndoe", get_full_name: "John Doe" },
                emergency_event: { is_authority: false, agency_name: null }
            },
            {
                call_id: 5,
                start_time: "Mon 9 Aug, 10:49 AM",
                end_time: "Mon 9 Aug, 10:59 AM",
                duration: 600, // 10 minutes
                call_type: "outgoing",
                get_call_type_display: "Outgoing",
                user_id: { id: 105, username: "alicesmith", get_full_name: "Alice Smith" },
                emergency_event: { is_authority: true, agency_name: "Medical Team" }
            },
            {
                call_id: 6,
                start_time: "Saturday 9 Aug, 10:49 AM",
                end_time: "Saturday 9 Aug, 10:49 AM",
                duration: 30, // 30 seconds
                call_type: "incoming",
                get_call_type_display: "Incoming",
                user_id: { id: 106, username: "charliebrown", get_full_name: "Charlie Brown" },
                emergency_event: { is_authority: false, agency_name: null }
            },
            {
                call_id: 7,
                start_time: "Saturday 9 Aug, 09:30 AM",
                end_time: "Saturday 9 Aug, 10:45 AM",
                duration: 4500, // 1 hour 15 minutes
                call_type: "outgoing",
                get_call_type_display: "Outgoing",
                user_id: { id: 107, username: "sarahlee", get_full_name: "Sarah Lee" },
                emergency_event: { is_authority: true, agency_name: "Crisis Intervention" }
            },
            {
                call_id: 8,
                start_time: "Mon 8 Aug, 08:00 AM",
                end_time: null,
                duration: 0,
                call_type: "missed",
                get_call_type_display: "Missed",
                user_id: { id: 108, username: "mikejones", get_full_name: "Mike Jones" },
                emergency_event: { is_authority: false, agency_name: null }
            }
        ];

        // Function to format duration (mimics Django model property)
        function formatDuration(totalSeconds) {
            if (totalSeconds === null || totalSeconds === undefined || totalSeconds === 0) {
                return "00:00";
            }

            const hours = Math.floor(totalSeconds / 3600);
            const remainingSeconds = totalSeconds % 3600;
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;

            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function renderCallLogs(filterType = 'all', searchTerm = '') {
            const tableBody = document.getElementById('call-log-table-body');
            tableBody.innerHTML = ''; // Clear existing rows
            const noCallsMessage = document.getElementById('no-calls-message');
            noCallsMessage.classList.add('hidden');

            let filteredLogs = mockCallLogsData;

            // Apply filter by call type
            if (filterType === 'missed') {
                filteredLogs = filteredLogs.filter(log => log.call_type === 'missed');
            }

            // Apply search term filter
            const lowerCaseSearchTerm = searchTerm.toLowerCase();
            if (lowerCaseSearchTerm) {
                filteredLogs = filteredLogs.filter(log =>
                    (log.user_id.get_full_name && log.user_id.get_full_name.toLowerCase().includes(lowerCaseSearchTerm)) ||
                    (log.emergency_event.agency_name && log.emergency_event.agency_name.toLowerCase().includes(lowerCaseSearchTerm)) ||
                    log.start_time.toLowerCase().includes(lowerCaseSearchTerm) ||
                    (log.end_time && log.end_time.toLowerCase().includes(lowerCaseSearchTerm)) ||
                    log.get_call_type_display.toLowerCase().includes(lowerCaseSearchTerm) ||
                    formatDuration(log.duration).toLowerCase().includes(lowerCaseSearchTerm)
                );
            }


            if (filteredLogs.length === 0) {
                noCallsMessage.classList.remove('hidden');
                return;
            }

            filteredLogs.forEach(call_log => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';

                const contactNameHtml = `
                    <div class="flex items-center">
                        <div class="flex-shrink-0 h-10 w-10">
                            ${call_log.emergency_event.is_authority ?
                                `<img class="h-10 w-10 rounded-full" src="{% static 'images/fire_department_logo.png' %}" alt="Agency Logo">` :
                                `<img class="h-10 w-10 rounded-full" src="https://i.pravatar.cc/40?u=${call_log.user_id.username}" alt="User Avatar">`
                            }
                        </div>
                        <div class="ml-4">
                            <div class="text-sm font-medium text-gray-900">${call_log.user_id.get_full_name || call_log.user_id.username}</div>
                            ${call_log.emergency_event.is_authority && call_log.emergency_event.agency_name ?
                                `<div class="text-sm text-gray-500">${call_log.emergency_event.agency_name}</div>` : ''
                            }
                        </div>
                    </div>
                `;

                const callTypeClass = call_log.call_type === 'incoming' ? 'bg-green-100 text-green-800' :
                                      call_log.call_type === 'outgoing' ? 'bg-blue-100 text-blue-800' :
                                      'bg-red-100 text-red-800';

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${contactNameHtml}</td>
                    <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-900">${call_log.start_time}</div></td>
                    <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-900">${call_log.end_time || 'N/A'}</div></td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${callTypeClass}">
                            ${call_log.get_call_type_display}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDuration(call_log.duration)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="callAgain(${call_log.user_id.id})" class="bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1 rounded-md text-xs font-semibold mr-2">Call Again</button>
                        <button onclick="deleteCallLog(${call_log.call_id})" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded-md text-xs font-semibold mr-2">Delete</button>
                        <a href="{% url 'communication:messages' %}".replace('0', ${call_log.user_id.id})" class="inline-flex items-center text-gray-500 hover:text-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                            </svg>
                        </a>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // --- Event Listeners and Initial Render ---

        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuOpenIcon = document.getElementById('menu-open-icon');
        const menuCloseIcon = document.getElementById('menu-close-icon');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            menuOpenIcon.classList.toggle('hidden');
            menuCloseIcon.classList.toggle('hidden');
        });

        // Category filters
        const filterAll = document.getElementById('filter-all');
        const filterMissed = document.getElementById('filter-missed');
        let currentFilter = 'all'; // Default filter

        filterAll.addEventListener('click', (e) => {
            e.preventDefault();
            currentFilter = 'all';
            filterAll.classList.add('bg-red-600', 'text-white');
            filterAll.classList.remove('text-gray-700', 'bg-gray-100', 'hover:bg-gray-200');
            filterMissed.classList.remove('bg-red-600', 'text-white');
            filterMissed.classList.add('text-gray-700', 'bg-gray-100', 'hover:bg-gray-200');
            renderCallLogs(currentFilter, document.getElementById('search-input').value);
        });

        filterMissed.addEventListener('click', (e) => {
            e.preventDefault();
            currentFilter = 'missed';
            filterMissed.classList.add('bg-red-600', 'text-white');
            filterMissed.classList.remove('text-gray-700', 'bg-gray-100', 'hover:bg-gray-200');
            filterAll.classList.remove('bg-red-600', 'text-white');
            filterAll.classList.add('text-gray-700', 'bg-gray-100', 'hover:bg-gray-200');
            renderCallLogs(currentFilter, document.getElementById('search-input').value);
        });

        // Search functionality
        document.getElementById('search-input').addEventListener('keyup', function() {
            renderCallLogs(currentFilter, this.value);
        });

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderCallLogs(currentFilter, document.getElementById('search-input').value);
        });


        // Placeholder functions for actions
        function callAgain(userId) {
            alert('Initiating call to user ID: ' + userId);
        }

        function deleteCallLog(callId) {
            if (confirm('Are you sure you want to delete this call log?')) {
                alert('Deleting call log ID: ' + callId);
                // For mock data, you could implement a splice and re-render here
            }
        }
    </script>
</body>
</html>
