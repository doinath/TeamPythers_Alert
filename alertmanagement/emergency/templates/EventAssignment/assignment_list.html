{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment List</title>
    <link rel="stylesheet" href="{% static 'emergency/assignment_list_design.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo">
                <img src="{% static 'emergency/logo.jpg' %}" alt="ALERT Logo">
                <span class="logo-text"></span>
            </div>
            <nav class="nav-links">
                <a href="#">Dashboard</a>
                <a href="#">Chat</a>
                <a href="#" class="active">Call Logs</a>
            </nav>
            <div class="user-info">
                <span>Bessie Cooper</span>
                <img src="{% static 'emergency/profile_image.jpg' %}" alt="User Profile" class="profile-pic">
                <i class="fas fa-ellipsis-v settings-icon"></i>
            </div>
        </header>

        <main class="content-area">
            <div class="filter-bar">
                <div class="filter-tabs">
                    <button class="tab active">All</button>
                    <button class="tab">Pending</button>
                    <button class="tab">On the way</button>
                    <button class="tab">In location</button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="assignments-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>EMERGENCY</th>
                            <th>SENDER</th>
                            <th>TIME AND DATE</th>
                            <th>LOCATION</th>
                            <th>SEVERITY LEVEL</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><i class="fas fa-fire icon-red"></i> Fire</td>
                            <td>Monga, Bernadette P.</td>
                            <td>11:30 31/10/25</td>
                            <td>Iwayan, Talisay City</td>
                            <td><span class="severity-tag very-high">Very High</span></td>
                            <td>Pending</td>
                        </tr>
                        <tr>
                            <td><i class="fas fa-house-damage icon-orange"></i> Earthquake</td>
                            <td>Bai, Micheal C.</td>
                            <td>11:27 31/10/25</td>
                            <td>Tabunok, Talisay City</td>
                            <td><span class="severity-tag low">Low</span></td>
                            <td>Assigned</td>
                        </tr>
