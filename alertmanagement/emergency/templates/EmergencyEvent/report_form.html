{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Form - ALERT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }

        /* Custom Radio Button Color Override */
        input[type="radio"]:checked {
            background-color: #d9534f;
            border-color: #d9534f;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-[#f0f2f5] font-sans text-[#333] min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Left Side -->
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-2">
                        <img src="{% static 'emergency/logo.jpg' %}" alt="ALERT Logo" class="h-10 w-auto object-contain" />
                    </div>
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="#" class="text-red-600 border-b-2 border-red-600 font-semibold px-2 py-1">Dashboard</a>
                        <a href="#" class="text-gray-500 hover:text-red-600 transition-colors font-medium">Chat</a>
                        <a href="#" class="text-gray-500 hover:text-red-600 transition-colors font-medium">Call Logs</a>
                    </nav>
                </div>
                <!-- Right Side -->
                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center space-x-4">
                        <span class="text-gray-800 font-medium text-sm mr-2">Julian Andales</span>
                        <img class="h-8 w-8 rounded-full object-cover border border-gray-200" src="{% static 'emergency/profile_image.jpg' %}" alt="User Avatar" />
                    </div>
                    <!-- Mobile Menu Button -->
                    <div class="md:hidden flex items-center">
                        <button id="mobile-menu-button" class="text-gray-600 hover:text-gray-800 focus:outline-none">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t p-4">
            <nav class="space-y-2">
                <a href="#" class="block py-2 text-red-600 font-bold bg-red-50 rounded px-2">Dashboard</a>
                <a href="#" class="block py-2 text-gray-600 hover:bg-gray-50 rounded px-2">Chat</a>
                <a href="#" class="block py-2 text-gray-600 hover:bg-gray-50 rounded px-2">Call Logs</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow container mx-auto max-w-[1400px] p-5 animate-fadeIn">

        <div class="bg-white rounded-[10px] shadow-md p-6 sm:p-8">

            <div class="mb-8 border-b border-gray-200 pb-4">
                <h2 class="text-2xl font-bold text-[#d9534f] uppercase tracking-wide">Report Form</h2>
            </div>

            <!-- Content Grid -->
            <div class="flex flex-col lg:flex-row gap-10">

                <!-- Left Panel: Form Inputs -->
                <div class="flex-1 space-y-6">

                    <!-- Name -->
                    <div>
                        <label for="name" class="block text-sm font-bold text-gray-700 uppercase mb-2">Name</label>
                        <input type="text" id="name" placeholder="(automatically filled up by the system)"
                            class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f] bg-gray-50" readonly>
                    </div>

                    <!-- Address -->
                    <div>
                        <label for="address" class="block text-sm font-bold text-gray-700 uppercase mb-2">Address</label>
                        <input type="text" id="address" placeholder="(automatically filled up by the system)"
                            class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f] bg-gray-50" readonly>
                    </div>

                    <!-- Type of Emergency -->
                    <div>
                        <label class="block text-sm font-bold text-[#d9534f] uppercase mb-3">Type of Emergency</label>
                        <div class="flex flex-wrap gap-x-6 gap-y-3 mb-3">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="emergencyType" value="fire" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">FIRE</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="emergencyType" value="crime" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">CRIME</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="emergencyType" value="medical" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">MEDICAL</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="emergencyType" value="accident" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">ACCIDENT</span>
                            </label>
                        </div>
                        <!-- Others Input -->
                        <div class="flex items-center gap-2 mt-2">
                            <label class="flex items-center space-x-2 cursor-pointer shrink-0">
                                <input type="radio" name="emergencyType" value="others" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">OTHERS; SPECIFY</span>
                            </label>
                            <input type="text" id="others" class="flex-1 border-b border-gray-300 py-1 px-2 text-sm focus:outline-none focus:border-[#d9534f] transition-colors">
                        </div>
                    </div>

                    <!-- Reporting for Others -->
                    <div class="bg-gray-50 p-4 rounded-md border border-gray-100">
                        <label class="block text-sm font-bold text-[#d9534f] uppercase mb-2">Are you reporting for others?</label>
                        <div class="flex space-x-6 mb-4">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="reportingForOthers" value="yes" class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">YES</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="reportingForOthers" value="no" checked class="w-4 h-4 text-[#d9534f] focus:ring-[#d9534f]">
                                <span class="text-sm font-semibold text-gray-700">NO</span>
                            </label>
                        </div>

                        <p class="text-xs text-gray-500 mb-2 font-medium uppercase">If you can name the patient, please indicate (Optional)</p>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <input type="text" placeholder="First Name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f]">
                            <input type="text" placeholder="Middle Name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f]">
                            <input type="text" placeholder="Last Name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f]">
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="description" class="block text-sm font-bold text-gray-700 uppercase mb-2">Describe the Situation</label>
                        <textarea id="description" rows="4" class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-[#d9534f] focus:ring-1 focus:ring-[#d9534f] resize-y"></textarea>
                    </div>

                </div>

                <!-- Right Panel: Map -->
                <div class="w-full lg:w-1/3 flex flex-col gap-4">
                    <div class="relative w-full h-64 lg:h-80 rounded-lg overflow-hidden shadow-inner border border-gray-200 bg-gray-100 group">
                        <img src="{% static 'emergency/map_image.png' %}" alt="Map Placeholder" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 text-xs font-bold text-gray-500 uppercase rounded shadow">
                            Map Preview
                        </div>
                    </div>
                    <button class="w-full py-2 border-2 border-[#d9534f] text-[#d9534f] font-bold rounded hover:bg-red-50 transition-colors uppercase text-sm tracking-wide">
                        Adjust Pin
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end">
                <button class="w-full md:w-auto px-8 py-3 bg-[#d9534f] text-white font-bold rounded shadow-md hover:bg-[#c9302c] hover:-translate-y-0.5 transition-all duration-200 uppercase tracking-wide text-sm sm:text-base">
                    Submit Report
                </button>
            </div>

        </div>
    </main>

    <!-- Mobile Menu Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');

            if (mobileMenuButton) {
                mobileMenuButton.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>
</html>
